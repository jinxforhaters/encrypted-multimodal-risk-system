services:
  - type: web
    name: encrypted-multimodal-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: encrypted_multimodal_db
      - key: MONGO_COLLECTION_NAME
        value: risk_records
