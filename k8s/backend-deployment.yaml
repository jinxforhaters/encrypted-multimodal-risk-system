apiVersion: apps/v1
kind: Deployment
metadata:
  name: encrypted-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: encrypted-backend
  template:
    metadata:
      labels:
        app: encrypted-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub-username/encrypted-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: encrypted_multimodal_db
            - name: MONGO_COLLECTION_NAME
              value: risk_records
---
apiVersion: v1
kind: Service
metadata:
  name: encrypted-backend-service
spec:
  selector:
    app: encrypted-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
