services:
  - type: web
    name: encrypted-multimodal-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: encrypted_multimodal_db
      - key: MONGO_COLLECTION_NAME
        value: risk_records
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

  - type: web
    name: encrypted-multimodal-dashboard
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./dashboard/Dockerfile
    envVars:
      - key: API_BASE_URL
        value: https://encrypted-multimodal-backend.onrender.com
